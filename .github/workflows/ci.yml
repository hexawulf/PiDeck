# CI for every PR and push to main: typecheck, ESLint, theme and shell lint,
# unit + real-Postgres tests, installer tests, production build, and full
# Playwright E2E against a scratch PostgreSQL 18 database and local agents.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18 # production (piapps) runs PostgreSQL 18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PIDECK_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      SHELLCHECK_OPTS: -S warning

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # the supported line (scripts/install.sh requires 22.x)
          cache: npm

      # Node 22 ships npm 10, which reads the lockfile's overrides (gaxios,
      # rimraf under firebase-admin) differently and refuses `npm ci`.
      # piapps runs npm 11.13; match it.
      - name: Align npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Theme tokens
        run: npm run check:theme

      - name: Shell scripts
        run: npm run check:shell

      - name: Unit tests (with Postgres)
        run: npx vitest run

      - name: Installer tests
        run: npm run test:install

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PIDECK_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Align npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
