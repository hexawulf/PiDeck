<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiDeck</title>
    <meta name="color-scheme" content="light dark" />
    <!--
      No-flash theme script: sets <html class="light|dark"> before first paint.
      Mirrors resolveTheme() in src/lib/theme.ts (key: pideck-ui-theme).
      Allowed by CSP via a sha256 computed at server startup (server/security.ts),
      so editing it needs no manual hash update.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("pideck-ui-theme"); } catch (e) {}
        var dark = stored === "dark" ||
          (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Must be type="module" -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
