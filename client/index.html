<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiDeck</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Cg fill='white'%3E%3Crect x='7' y='7' width='8' height='10' rx='2'/%3E%3Crect x='17' y='7' width='8' height='6' rx='2'/%3E%3Crect x='17' y='15' width='8' height='10' rx='2'/%3E%3Crect x='7' y='19' width='8' height='6' rx='2'/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="color-scheme" content="light dark" />
    <!--
      No-flash theme script: sets <html class="light|dark"> before first paint.
      Mirrors resolveTheme() in src/lib/theme.ts (key: pideck-ui-theme).
      Allowed by CSP via a sha256 computed at server startup (server/security.ts),
      so editing it needs no manual hash update.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("pideck-ui-theme"); } catch (e) {}
        var dark = stored === "dark" ||
          (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Must be type="module" -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
